<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Signal continuously gathers reporting on the topics you follow." />
    <meta name="theme-color" content="#171815" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Signal" />
    <link rel="icon" type="image/png" href="/icons/signal-medallion-64.png" />
    <link rel="apple-touch-icon" href="/icons/signal-medallion-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>try{const s=localStorage.getItem("signal-color-theme");const t=s==="light"||s==="dark"?s:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t}catch{}</script>
    <title>Signal — Your personal news monitor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
